<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backend Login Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background: #0056b3;
        }
        pre {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
        }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>🧪 Backend Login Test</h1>
    
    <div class="test-section">
        <h2>Test All Login Endpoints</h2>
        <button onclick="testLogin('principal', 'admin123', '/api/auth/principal/login')">Test Principal</button>
        <button onclick="testLogin('office', 'office123', '/api/auth/office/login')">Test Office</button>
        <button onclick="testLogin('hod', 'hod123', '/api/auth/staff/login')">Test HOD</button>
        <button onclick="testLogin('faculty', 'faculty123', '/api/auth/staff/login')">Test Faculty</button>
        <button onclick="testLogin('student', 'student123', '/api/auth/student/login')">Test Student</button>
    </div>

    <div class="test-section">
        <h2>Results:</h2>
        <div id="results"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080';

        async function testLogin(username, password, endpoint) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML += `<p>🔄 Testing ${username}...</p>`;

            try {
                const response = await fetch(API_BASE + endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    resultsDiv.innerHTML += `
                        <div class="success">
                            <h3>✅ ${username} Login SUCCESS</h3>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                            <p><strong>Token:</strong> ${data.token ? '✅ Present' : '❌ Missing'}</p>
                            <p><strong>Username:</strong> ${data.username || '❌ Missing'}</p>
                            <p><strong>Role:</strong> ${data.role || '❌ Missing'}</p>
                            <p><strong>Email:</strong> ${data.email || '❌ Missing'}</p>
                        </div>
                    `;

                    // Test localStorage
                    localStorage.setItem('test_user', JSON.stringify(data));
                    const retrieved = JSON.parse(localStorage.getItem('test_user'));
                    resultsDiv.innerHTML += `
                        <p class="success">✅ localStorage test: ${retrieved.role === data.role ? 'PASS' : 'FAIL'}</p>
                    `;
                } else {
                    resultsDiv.innerHTML += `
                        <div class="error">
                            <h3>❌ ${username} Login FAILED</h3>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                resultsDiv.innerHTML += `
                    <div class="error">
                        <h3>❌ ${username} Network Error</h3>
                        <pre>${error.message}</pre>
                    </div>
                `;
            }

            resultsDiv.innerHTML += '<hr>';
        }
    </script>
</body>
</html>
